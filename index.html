<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102c4b">
  <meta name="apple-mobile-web-app-title" content="APP Safety">
  <title>APP Safety Reporting</title>
  <link rel="icon" type="image/png" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #102c4b;
      background: #eef2f6;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
    }

    main {
      box-sizing: border-box;
      width: min(27rem, calc(100% - 2rem));
      margin: 2rem auto;
      padding: clamp(1.5rem, 6vw, 2.5rem);
      border-top: 4px solid #9d0031;
      border-radius: 0.875rem;
      background: #fff;
      box-shadow: 0 0.5rem 2rem rgb(16 44 75 / 12%);
      text-align: center;
    }

    img {
      display: block;
      width: min(12rem, 100%);
      height: auto;
      margin: 0 auto 1.5rem;
      border-radius: 1.125rem;
    }

    a {
      display: block;
      padding: 0.875rem 1rem;
      border-radius: 0.5rem;
      background: #102c4b;
      color: #fff;
      font-size: 1.0625rem;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      background: #183f65;
    }

    a:focus-visible {
      outline: 3px solid #9d0031;
      outline-offset: 4px;
    }

    p {
      margin: 0.875rem 0 0;
      color: #42576c;
      font-size: 0.9rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main aria-label="APP Safety Reporting">
    <img src="./icon.png" alt="APP Safety Reporting" width="1254" height="1254">
    <a href="https://apps.powerapps.com/play/e/default-807082d2-4d7e-4b7c-b507-ef6478cb5caa/a/34ae880f-0a0d-4388-a945-4fd02d731d8e?tenantId=807082d2-4d7e-4b7c-b507-ef6478cb5caa&amp;hint=adb706b1-079f-4ee4-8de0-fe1ab83560e9&amp;sourcetime=1794409125033">Open Safety Reporting</a>
    <p>Sign in with your APP Microsoft 365 account.</p>
  </main>
</body>
</html>
